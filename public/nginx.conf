# ==============================================================================
# MediClinic ERP - NGINX Configuration for React SPA & PWA Production UI
# Place in /etc/nginx/sites-available/mediclinic or include in http block
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost clinic.local;

    # Root directory pointing to the extracted UI build folder
    root /var/www/mediclinic;
    index index.html;

    # Gzip Compression for maximum performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/manifest+json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Cache static assets (JS, CSS, Images, Fonts) with immutable caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Service Worker & PWA Manifest - do NOT cache aggressively
    location ~* (?:sw\.js|manifest\.webmanifest|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Optional: Reverse proxy /api requests to local SQL Server bridge (port 5001)
    location /api/ {
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # React Single Page App fallback routing
    # All route URLs (e.g. /pos, /inventory, /pwa-sync) redirect to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
